<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pizzeria Punto — Livrare</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>

<nav class="nav">
  <span class="nav-title">Pizzeria Punto — test</span>
  <a href="/index.html">Comandă</a>
  <a href="/kitchen.html">Bucătărie</a>
  <a href="/driver.html" class="active">Livrare</a>
  <span class="conn-status" id="conn-status"><span class="conn-dot"></span><span id="conn-status-text">Conectare...</span></span>
</nav>

<main class="page">
  <h1>Ecran livrator</h1>
  <p class="subtitle">Starea se reconstruiește din baza de date la încărcare, apoi se actualizează live prin WebSocket.</p>

  <div id="orders-container" class="grid" style="margin-top:16px"></div>
</main>

<script src="/api.js"></script>
<script>
(function () {
  "use strict";

  const esc = PizzaApi.escapeHtml;
  const toast = PizzaApi.createToaster();

  const STATUS_LABELS = {
    new: "Nouă",
    in_kitchen: "În bucătărie",
    ready: "Gata",
    assigned: "Alocată livratorului",
    out: "Pe drum",
    delivered: "Livrată",
    picked_up: "Ridicată",
    cancelled: "Anulată",
  };
  const PAYMENT_LABELS = { cash: "Numerar", card_on_delivery: "Card la livrare" };

  const EMPTY_STATE_HTML = `
    <div class="empty-state">
      Nicio livrare de preluat momentan.<br />
      Comenzile apar aici <strong>doar</strong> din momentul în care bucătăria le marchează „Gata” —
      și <strong>ridicările nu apar niciodată</strong> pe acest ecran.
    </div>
  `;

  let orders = [];
  /**
   * Comenzile deja văzute pe ecran. Servesc la două lucruri: anunțul unei comenzi
   * noi și animația de intrare — fără ele, orice eveniment WebSocket ar reanima
   * toate cardurile și ar anunța din nou comenzi vechi.
   */
  const seenOrderIds = new Set();
  /** `true` până la prima încărcare: comenzile deja în baza de date nu sunt „noi". */
  let isFirstLoad = true;
  /**
   * Numărul încărcării curente. Fiecare eveniment WebSocket pornește o cerere nouă,
   * iar răspunsurile nu sosesc neapărat în ordinea în care au plecat: două evenimente
   * apropiate (o comandă plasată și imediat preluată) pot da un răspuns vechi sosit
   * ultimul, care ar repicta ecranul cu starea dinainte — cardul ar sări înapoi la
   * statusul anterior. Se afișează doar rezultatul ultimei cereri pornite.
   */
  let loadSequence = 0;

  /** Rulează un apel API, arată eroarea ca pop-up și întoarce `null` la eșec. */
  async function guarded(promiseFactory) {
    try {
      return await promiseFactory();
    } catch (err) {
      toast.reportError(err);
      return null;
    }
  }

  async function loadOrders() {
    const sequence = (loadSequence += 1);
    const result = await guarded(() => PizzaApi.apiGet("/api/orders?view=driver"));
    if (!result) return;
    if (sequence !== loadSequence) return;
    orders = result;
    announceNewOrders();
    renderOrders();
  }

  /** Anunță comenzile apărute de la ultima încărcare. Prima încărcare nu anunță nimic. */
  function announceNewOrders() {
    const fresh = orders.filter((order) => !seenOrderIds.has(order.id));
    orders.forEach((order) => seenOrderIds.add(order.id));
    if (isFirstLoad) {
      isFirstLoad = false;
      return;
    }
    fresh.forEach((order) =>
      toast.info(`Comandă nouă: ${PizzaApi.formatOrderNumber(order)}.`, { durationMs: 8000 })
    );
  }

  function renderOrders() {
    const container = document.getElementById("orders-container");
    if (orders.length === 0) {
      container.innerHTML = EMPTY_STATE_HTML;
      return;
    }
    const known = new Set(
      Array.prototype.map.call(container.querySelectorAll(".card[data-order-id]"), (el) => el.dataset.orderId)
    );
    container.innerHTML = orders.map(buildOrderCard).join("");
    container.querySelectorAll(".card[data-order-id]").forEach((card) => {
      if (!known.has(card.dataset.orderId)) card.classList.add("card--enter");
    });
    container.querySelectorAll(".btn-transition").forEach((button) => {
      button.addEventListener("click", () => transitionOrder(button.dataset.orderId, button.dataset.status));
    });
  }

  function buildAddressDetailsHtml(address) {
    if (!address) {
      return '<div class="muted">Fără adresă înregistrată (neobișnuit pentru o livrare).</div>';
    }
    const subFields = [
      ["block", "Bloc"],
      ["staircase", "Scară"],
      ["floor", "Etaj"],
      ["apartment", "Apartament"],
      ["intercom", "Interfon"],
      ["notes", "Detalii"],
    ];
    const details = subFields
      .filter(([key]) => address[key])
      .map(([key, label]) => `<li>${label}: ${esc(address[key])}</li>`)
      .join("");
    const headline = address.formatted || `${address.street} ${address.number}`;
    return `
      <div><strong>${esc(headline)}</strong></div>
      ${details ? `<ul>${details}</ul>` : ""}
    `;
  }

  function buildOrderCard(order) {
    const lines = order.cart.lines
      .map(
        (line) => `
      <li>${line.qty} × ${esc(line.product_name)}${line.size_label ? " (" + esc(line.size_label) + ")" : ""}
        ${line.removed_ingredients.length ? " — fără " + esc(line.removed_ingredients.join(", ")) : ""}</li>`
      )
      .join("");

    let actionsHtml = "";
    if (order.status === "ready") {
      actionsHtml = `<button type="button" class="btn btn--primary btn-transition" data-order-id="${esc(order.id)}" data-status="assigned">Preiau</button>`;
    } else if (order.status === "assigned") {
      actionsHtml = `<button type="button" class="btn btn--primary btn-transition" data-order-id="${esc(order.id)}" data-status="out">Am plecat</button>`;
    } else if (order.status === "out") {
      actionsHtml = `<button type="button" class="btn btn--primary btn-transition" data-order-id="${esc(order.id)}" data-status="delivered">Livrat</button>`;
    }

    return `
      <div class="card" data-order-id="${esc(order.id)}">
        <div class="row" style="justify-content:space-between">
          <strong>${esc(PizzaApi.formatOrderNumberCapitalized(order))}</strong>
          <span class="badge badge--status-${esc(order.status)}">${STATUS_LABELS[order.status] || order.status}</span>
        </div>
        ${buildAddressDetailsHtml(order.address)}
        <div>Telefon: ${esc(order.contact.phone)}${order.contact.name ? " — " + esc(order.contact.name) : ""}</div>
        <ul>${lines || "<li>Fără produse</li>"}</ul>
        <div class="row" style="justify-content:space-between">
          <span>Total: ${PizzaApi.formatBani(order.cart.total_bani)}</span>
          <span>Plată: ${PAYMENT_LABELS[order.payment] || order.payment}</span>
        </div>
        <div class="muted">ETA: ${PizzaApi.formatEtaWindow(order.eta)}</div>
        <div class="row">${actionsHtml}</div>
      </div>
    `;
  }

  async function transitionOrder(orderId, status) {
    const result = await guarded(() => PizzaApi.apiPost(`/api/orders/${orderId}/status`, { status }));
    if (!result) return;
    // Confirmarea e necesară: cardul dispare din listă la statusuri finale, iar fără
    // ea livratorul nu știe dacă apăsarea a contat sau comanda a picat din alt motiv.
    const changed = orders.find((order) => order.id === orderId);
    toast.success(
      `${PizzaApi.formatOrderNumberCapitalized(changed || { id: orderId })}: ${STATUS_LABELS[status] || status}.`
    );
    await loadOrders();
  }

  const connStatusEl = document.getElementById("conn-status");
  const connStatusTextEl = document.getElementById("conn-status-text");
  const CONN_LABELS = { connected: "Conectat", connecting: "Conectare…", disconnected: "Deconectat — se reconectează…" };

  function updateConnStatus(status) {
    connStatusEl.classList.remove("connected", "connecting", "disconnected");
    connStatusEl.classList.add(status);
    connStatusTextEl.textContent = CONN_LABELS[status] || status;
  }

  loadOrders();
  PizzaApi.connectOrdersSocket({
    onEvent: () => loadOrders(),
    onStatus: updateConnStatus,
  });
})();
</script>
</body>
</html>
