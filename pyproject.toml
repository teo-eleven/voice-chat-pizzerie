[project]
name = "pizza-punto"
version = "0.1.0"
description = "Agent vocal de preluare comenzi pentru Pizzeria Punto"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlmodel>=0.0.22",
    "httpx>=0.27",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["packages/domain", "apps/api", "apps/agent"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# `S` = flake8-bandit (securitate), `RUF` = reguli proprii ruff, `C4` = comprehensions,
# `ANN` = adnotari lipsa. Codul e deja scris in stilul asta peste tot; regulile sunt
# aici ca sa nu se piarda disciplina la urmatoarea faza, nu ca sa repare ceva acum.
select = ["E", "F", "I", "UP", "B", "SIM", "S", "RUF", "C4", "ANN"]

[tool.ruff.lint.per-file-ignores]
# Testele au voie sa foloseasca `assert` (S101) — acolo e chiar unealta potrivita —
# si nu au nevoie de adnotari de retur pe fiecare caz de test (ANN).
"tests/*" = ["S101", "ANN"]
"scripts/*" = ["ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
# Codul e adnotat integral, dar SQLModel/SQLAlchemy nu expun tipuri complete.
plugins = []

[[tool.mypy.overrides]]
module = ["sqlmodel.*", "sqlalchemy.*"]
ignore_missing_imports = true
